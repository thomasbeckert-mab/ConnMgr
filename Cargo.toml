[package]
name = "conmgr"
version = "0.1.0"
edition = "2021"
description = "Plattformübergreifender Verbindungsmanager für SSH, SFTP, RDP und VNC"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
arboard = "3"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "~0.4.45", default-features = false, features = ["clock", "std"] }
directories = "5"
eframe = "0.29"
egui_extras = "0.29.1"
ironrdp-connector = "=0.11.0"
ironrdp-session = "=0.12.0"
ironrdp-graphics = "=0.10.0"
ironrdp-input = "=0.8.0"
ironrdp-pdu = "=0.10.0"
ironrdp-tls = { version = "=0.3.0", default-features = false, features = ["rustls-ring"] }
ironrdp-async = "=0.11.0"
ironrdp-tokio = "=0.11.0"
rand = "0.8"
rfd = "~0.17.2"
rpassword = "7"
russh-sftp = "~3.0.1"
russh = { version = "~0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "~1.53.2", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
uuid = { version = "1", features = ["v4"] }
vnc-rs = "~0.6.0"
vt100 = "~0.16.2"
zeroize = "1"

[profile.release]
lto = true
strip = true

[dev-dependencies]
# Test-Server für die TLS-Zertifikatsprüfung im RDP-Test (gleiche Versionen wie über ironrdp-tls).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
